---
# Integration tests for stevefulme1.truenas.dataset_inherit

- name: Query dataset_inherit info
  stevefulme1.truenas.dataset_inherit_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify dataset_inherit info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run dataset_inherit (check_mode)
  stevefulme1.truenas.dataset_inherit:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    properties: {}
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
