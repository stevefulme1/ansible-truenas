---
# defaults/main.yml for truenas_storage_setup

# Connection
truenas_storage_setup_host: ""
truenas_storage_setup_api_key: ""
truenas_storage_setup_validate_certs: true

# ZFS pools
truenas_storage_setup_pools:
  []
