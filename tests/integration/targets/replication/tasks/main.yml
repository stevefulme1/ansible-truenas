---
# Integration tests for stevefulme1.truenas.replication

- name: List replication resources
  stevefulme1.truenas.replication_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify replication listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create replication (check_mode)
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create replication
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  register: create_result

- name: Verify replication was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create replication again (idempotency)
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete replication (check_mode)
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete replication
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  register: delete_result

- name: Verify replication was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete replication again (idempotent)
  stevefulme1.truenas.replication:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    source_datasets: []
    target_dataset: "ansible-test-target_dataset"
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
