---
# Integration tests for stevefulme1.truenas.alert_service

- name: List alert_service resources
  stevefulme1.truenas.alert_service_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify alert_service listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create alert_service (check_mode)
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    type: Mail
    attributes: {}
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create alert_service
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    type: Mail
    attributes: {}
  register: create_result

- name: Verify alert_service was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create alert_service again (idempotency)
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    type: Mail
    attributes: {}
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete alert_service (check_mode)
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    type: Mail
    attributes: {}
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete alert_service
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    type: Mail
    attributes: {}
  register: delete_result

- name: Verify alert_service was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete alert_service again (idempotent)
  stevefulme1.truenas.alert_service:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    type: Mail
    attributes: {}
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
