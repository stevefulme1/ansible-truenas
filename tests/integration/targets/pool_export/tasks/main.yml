---
# Integration tests for stevefulme1.truenas.pool_export

- name: Query pool_export info
  stevefulme1.truenas.pool_export_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify pool_export info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run pool_export (check_mode)
  stevefulme1.truenas.pool_export:
    action: export
    pool: "{{ test_pool | default('tank') }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
