---
# Integration tests for stevefulme1.truenas.filesystem_acltemplate

- name: List filesystem_acltemplate resources
  stevefulme1.truenas.filesystem_acltemplate_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify filesystem_acltemplate listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create filesystem_acltemplate (check_mode)
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    description: "ansible-test-description"
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create filesystem_acltemplate
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    description: "ansible-test-description"
  register: create_result

- name: Verify filesystem_acltemplate was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create filesystem_acltemplate again (idempotency)
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    description: "ansible-test-description"
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete filesystem_acltemplate (check_mode)
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    description: "ansible-test-description"
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete filesystem_acltemplate
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    description: "ansible-test-description"
  register: delete_result

- name: Verify filesystem_acltemplate was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete filesystem_acltemplate again (idempotent)
  stevefulme1.truenas.filesystem_acltemplate:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    description: "ansible-test-description"
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
