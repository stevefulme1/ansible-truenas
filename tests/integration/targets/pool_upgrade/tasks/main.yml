---
# Integration tests for stevefulme1.truenas.pool_upgrade

- name: Query pool_upgrade info
  stevefulme1.truenas.pool_upgrade_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify pool_upgrade info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run pool_upgrade (check_mode)
  stevefulme1.truenas.pool_upgrade:
    pool: "{{ test_pool | default('tank') }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
