---
# Integration tests for stevefulme1.truenas.dataset_permission

- name: Query dataset_permission info
  stevefulme1.truenas.dataset_permission_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify dataset_permission info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run dataset_permission (check_mode)
  stevefulme1.truenas.dataset_permission:
    path: "/tmp/ansible-test-{{ resource_prefix }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
