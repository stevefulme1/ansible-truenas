---
# Integration tests for stevefulme1.truenas.smb_status_info

- name: Query smb_status_info
  stevefulme1.truenas.smb_status_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: result

- name: Verify smb_status_info returns data
  ansible.builtin.assert:
    that:
      - result is not failed
