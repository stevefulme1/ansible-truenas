---
# Integration tests for stevefulme1.truenas.snapshot_task

- name: List snapshot_task resources
  stevefulme1.truenas.snapshot_task_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify snapshot_task listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create snapshot_task (check_mode)
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    dataset: "{{ test_dataset | default('tank/test') }}"
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create snapshot_task
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    dataset: "{{ test_dataset | default('tank/test') }}"
  register: create_result

- name: Verify snapshot_task was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create snapshot_task again (idempotency)
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    dataset: "{{ test_dataset | default('tank/test') }}"
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete snapshot_task (check_mode)
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    dataset: "{{ test_dataset | default('tank/test') }}"
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete snapshot_task
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    dataset: "{{ test_dataset | default('tank/test') }}"
  register: delete_result

- name: Verify snapshot_task was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete snapshot_task again (idempotent)
  stevefulme1.truenas.snapshot_task:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    dataset: "{{ test_dataset | default('tank/test') }}"
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
