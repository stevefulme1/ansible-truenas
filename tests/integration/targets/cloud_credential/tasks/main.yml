---
# Integration tests for stevefulme1.truenas.cloud_credential

- name: List cloud_credential resources
  stevefulme1.truenas.cloud_credential_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify cloud_credential listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create cloud_credential (check_mode)
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    provider: "ansible-test-provider"
    attributes: {}
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create cloud_credential
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    provider: "ansible-test-provider"
    attributes: {}
  register: create_result

- name: Verify cloud_credential was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create cloud_credential again (idempotency)
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    provider: "ansible-test-provider"
    attributes: {}
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete cloud_credential (check_mode)
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    provider: "ansible-test-provider"
    attributes: {}
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete cloud_credential
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    provider: "ansible-test-provider"
    attributes: {}
  register: delete_result

- name: Verify cloud_credential was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete cloud_credential again (idempotent)
  stevefulme1.truenas.cloud_credential:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    provider: "ansible-test-provider"
    attributes: {}
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
