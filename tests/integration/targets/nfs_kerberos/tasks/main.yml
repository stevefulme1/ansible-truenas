---
# Integration tests for stevefulme1.truenas.nfs_kerberos

- name: List nfs_kerberos resources
  stevefulme1.truenas.nfs_kerberos_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify nfs_kerberos listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create nfs_kerberos (check_mode)
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create nfs_kerberos
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  register: create_result

- name: Verify nfs_kerberos was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create nfs_kerberos again (idempotency)
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete nfs_kerberos (check_mode)
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete nfs_kerberos
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
  register: delete_result

- name: Verify nfs_kerberos was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete nfs_kerberos again (idempotent)
  stevefulme1.truenas.nfs_kerberos:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
