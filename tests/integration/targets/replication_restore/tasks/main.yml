---
# Integration tests for stevefulme1.truenas.replication_restore

- name: Query replication_restore info
  stevefulme1.truenas.replication_restore_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify replication_restore info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run replication_restore (check_mode)
  stevefulme1.truenas.replication_restore:
    target_dataset: "{{ test_dataset | default('tank/test') }}"
    task_id: "{{ test_task_id | default(1) }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
