---
# Integration tests for stevefulme1.truenas.kerberos_realm

- name: List kerberos_realm resources
  stevefulme1.truenas.kerberos_realm_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify kerberos_realm listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

