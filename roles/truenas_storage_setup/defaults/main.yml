  #         disks: ["da0", "da1", "da2", "da3", "da4", "da5"]
  #     cache:
  #       - type: STRIPE
  #         disks: ["nvme0"]
  #     log:
  #       - type: MIRROR
  #         disks: ["nvme1", "nvme2"]
  #   encryption: false

# Datasets
truenas_storage_setup_datasets:
  []
  # - name: "tank/data"
  #   compression: "lz4"
  #   atime: "off"
  #   recordsize: "128K"
  #   quota: "500G"
  #   refquota: "400G"
  #   deduplication: "off"
  #   sync: "standard"
  #   copies: 1
  #   snapdir: "visible"
  #   aclmode: "passthrough"
