---
# Integration tests for stevefulme1.truenas.activedirectory

- name: Query activedirectory info
  stevefulme1.truenas.activedirectory_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify activedirectory info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run activedirectory (check_mode)
  stevefulme1.truenas.activedirectory:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    domainname: "ansible-test.example.com"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
