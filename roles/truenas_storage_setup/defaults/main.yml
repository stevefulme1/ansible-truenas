  #   threshold: 35
  #   schedule:
  #     dow: "7"
  #     hour: "2"
  #     minute: "0"

# Pool resilver priority
truenas_storage_setup_resilver:
  enabled: true
  begin: "18:00"
  end: "06:00"
  weekday: []

# Tunables
truenas_storage_setup_tunables:
  []
