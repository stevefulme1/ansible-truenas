---
# Integration tests for stevefulme1.truenas.smart_test

- name: List smart_test resources
  stevefulme1.truenas.smart_test_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify smart_test listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create smart_test (check_mode)
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    disk: "ansible-test-disk"
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create smart_test
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    disk: "ansible-test-disk"
  register: create_result

- name: Verify smart_test was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create smart_test again (idempotency)
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    disk: "ansible-test-disk"
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete smart_test (check_mode)
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    disk: "ansible-test-disk"
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete smart_test
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    disk: "ansible-test-disk"
  register: delete_result

- name: Verify smart_test was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete smart_test again (idempotent)
  stevefulme1.truenas.smart_test:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    disk: "ansible-test-disk"
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
