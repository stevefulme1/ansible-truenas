---
# Integration tests for stevefulme1.truenas.replication_run

- name: Query replication_run info
  stevefulme1.truenas.replication_run_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify replication_run info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run replication_run (check_mode)
  stevefulme1.truenas.replication_run:
    task_id: "{{ test_task_id | default(1) }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
