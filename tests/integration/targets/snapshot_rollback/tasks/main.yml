---
# Integration tests for stevefulme1.truenas.snapshot_rollback

- name: Query snapshot_rollback info
  stevefulme1.truenas.snapshot_rollback_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: info_result

- name: Verify snapshot_rollback info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run snapshot_rollback (check_mode)
  stevefulme1.truenas.snapshot_rollback:
    dataset: "{{ test_dataset | default('tank/test') }}"
    snapshot: "ansible-test-snap-{{ resource_prefix }}"
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
