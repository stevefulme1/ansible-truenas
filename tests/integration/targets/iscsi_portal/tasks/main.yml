---
# Integration tests for stevefulme1.truenas.iscsi_portal

- name: List iscsi_portal resources
  stevefulme1.truenas.iscsi_portal_info:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
  register: list_result

- name: Verify iscsi_portal listing
  ansible.builtin.assert:
    that:
      - list_result is not failed

- name: Create iscsi_portal (check_mode)
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    listen: []
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create iscsi_portal
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    listen: []
  register: create_result

- name: Verify iscsi_portal was created
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create iscsi_portal again (idempotency)
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: present
    listen: []
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete iscsi_portal (check_mode)
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    listen: []
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete iscsi_portal
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    listen: []
  register: delete_result

- name: Verify iscsi_portal was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete iscsi_portal again (idempotent)
  stevefulme1.truenas.iscsi_portal:
    api_url: "{{ truenas_api_url }}"
    api_key: "{{ truenas_api_key }}"
    validate_certs: "{{ truenas_validate_certs | default(false) }}"
    name: "ansible-test-{{ resource_prefix }}"
    state: absent
    listen: []
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
